# Alembic configuration for ChronoVision.
#
# The database URL is NOT set here; migrations/env.py reads it from the validated
# application settings (app.config.get_settings().database_url), so credentials never
# live in a committed file.
#
# Run migrations from the `backend/` directory:
#   alembic upgrade head
#   alembic upgrade head --sql        # emit DDL without connecting
#   alembic revision --autogenerate -m "..."

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
